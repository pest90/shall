name: ci
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup picks up the pinned toolchain from rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, msrv, stable]
        os: [ubuntu-latest]
        include:
          - toolchain: pinned
            os: macos-latest
          - toolchain: pinned
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain
        if: matrix.toolchain != 'pinned'
        shell: bash
        run: |
          if [ "${{ matrix.toolchain }}" = msrv ]; then
            tc=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          else
            tc=stable
          fi
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
      - run: cargo test --workspace
      - run: cargo run -p shall-cli -- --version
