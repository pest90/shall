name: ci
on:
  push:
    branches: [master]
  pull_request:
    # `edited` re-runs the convention check when the title changes.
    types: [opened, edited, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Passed through the environment, never interpolated into the script.
      - env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-conventions.sh "$BRANCH" "$TITLE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup picks up the pinned toolchain from rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # A crate must build from its package alone, as on crates.io.
      - run: cargo package --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [pinned, msrv, stable]
        os: [ubuntu-latest]
        include:
          - toolchain: pinned
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select toolchain
        if: matrix.toolchain != 'pinned'
        shell: bash
        run: |
          if [ "${{ matrix.toolchain }}" = msrv ]; then
            tc=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          else
            tc=stable
          fi
          rustup toolchain install "$tc" --profile minimal
          rustup override set "$tc"
      # Run every test binary, so one run shows all failures of a platform.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo run --locked -p shall-cli -- --version

  # macOS runs in its own workflow, macos.yml, so that a missing macOS
  # runner never turns this run red.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target check .
      - run: docker build -t shall .
      - run: docker run --rm shall --version
