name: release
# A pushed tag v1.2.3 or v1.2.3-rc.1 releases: binaries, container image,
# crates.io and the release page, see CONTRIBUTING.md, "Releases". The public
# steps run only after every build and test passed, and every one of them can
# run again, so a failed run is fixed by re-running its failed jobs.
#
# Everything else is a dry run, which publishes nothing: by hand, and on pull
# requests that change the pipeline.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - cliff.toml
      - scripts/check-release-tag.sh
      - scripts/publish-crates.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GIT_CLIFF_VERSION: 2.14.2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff and the tag check need the history.
          fetch-depth: 0
      # Passed through the environment, never interpolated into the script.
      # The checkout can turn an annotated tag into a lightweight one, so
      # fetch it again.
      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/check-release-tag.sh "$TAG"
      # Fails here rather than halfway through the publishing.
      - name: Package the crates
        run: cargo package --workspace --locked
      - name: Write the release notes
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          cargo install --locked --no-default-features --version "$GIT_CLIFF_VERSION" git-cliff
          if [ "$PUBLISH" = true ]; then
            git cliff --latest --strip all --output release-notes.md
            [ -s release-notes.md ] || { echo "no release notes" >&2; exit 1; }
          else
            git cliff --unreleased --strip all --output release-notes.md
          fi
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # GitHub's macOS runners are often not available; the job then
          # waits or fails, and a re-run picks it up.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            # A single binary: without this it needs the Visual C++ runtime.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup picks up the pinned toolchain from rust-toolchain.toml
      - run: rustup target add "$TARGET"
      # The tests run on what is released, so with its target and flags.
      - run: cargo test --workspace --locked --no-fail-fast --target "$TARGET"
      - run: cargo build --release --locked -p shall-cli --target "$TARGET"
      - name: Package the binary
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          name="shall-$version-$TARGET"
          mkdir -p "dist/$name"
          case $TARGET in
            *windows*) bin=shall.exe ;;
            *) bin=shall ;;
          esac
          cp "target/$TARGET/release/$bin" LICENSE README.md "dist/$name/"
          [ "$("dist/$name/$bin" --version | tr -d '\r')" = "shall $version" ]
          cd dist
          case $TARGET in
            *windows*) 7z a "$name.zip" "$name" ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          docker build -t shall \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.licenses=MIT" \
            .
      - run: docker run --rm shall --version
      - name: Push the image
        if: github.event_name == 'push'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Package names on ghcr.io are lower case.
          image="ghcr.io/${REPOSITORY,,}"
          version=${TAG#v}
          tags=("$version")
          # Pre-releases never move the tags that people follow.
          if [[ $version != *-* ]]; then
            tags+=("${version%.*}" latest)
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            docker tag shall "$image:$tag"
            docker push "$image:$tag"
          done

  crates:
    if: github.event_name == 'push'
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: scripts/publish-crates.sh "${TAG#v}"

  # Last, because this is what people and the tools that download a release
  # look at: a release page means that the release is complete.
  release:
    if: github.event_name == 'push'
    needs: [build, image, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release page
        run: |
          mkdir dist
          mv artifacts/binary-*/* dist/
          (cd dist && sha256sum -- * >SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ $TAG != *-* ]] || prerelease=(--prerelease)
            gh release create "$TAG" dist/* --verify-tag \
              --title "shall $TAG" \
              --notes-file artifacts/release-notes/release-notes.md \
              "${prerelease[@]}"
          fi
