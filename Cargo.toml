[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Specifications Hooked to Actual Lines of Logic: requirements-as-code traceability"
keywords = ["requirements", "traceability", "openfasttrace", "safety"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
shall-core = { path = "crates/shall-core", version = "0.1.0" }
shall-report = { path = "crates/shall-report", version = "0.1.0" }
shall-plugin = { path = "crates/shall-plugin", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
