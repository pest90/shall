# git-cliff: CHANGELOG.md, the release notes and the next version, from the
# Conventional Commits on `master`. See CONTRIBUTING.md, "Releases".

[changelog]
header = """
# Changelog

All notable changes to `shall`, from its Conventional Commits. Versions
follow [Semantic Versioning](https://semver.org)."""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endfor -%}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
# Final releases only: a final release lists all that is new since the last
# one, and the next version follows from it, not from a pre-release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The HTML comments order the groups and do not show.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  # Everything else is not for users: `build`, `ci`, `test`, `chore`, with the
  # release commits themselves.
  { message = ".*", skip = true },
]

[bump]
# The table in CONTRIBUTING.md: `feat` bumps the minor version, also before
# 1.0, where a breaking change bumps the minor version as well.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
